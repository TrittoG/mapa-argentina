<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pintá las provincias de Argentina o los estados de Brasil, armá la leyenda y descargá el mapa en PNG.">
<title>Mapa de Provincias y Estados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel de controles a la izquierda, lienzo del mapa a la derecha; se apilan en celular */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1b2430; --muted:#5c6877; --line:#d5dbe2;
  --accent:#1f5fa8; --accent-fg:#ffffff; --chip:#f3f5f8; --stage:#dfe4ea;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa6b4; --line:#2c3541;
  --accent:#6aa5ea; --accent-fg:#0d1420; --chip:#222a35; --stage:#0c0f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa6b4; --line:#2c3541;
  --accent:#6aa5ea; --accent-fg:#0d1420; --chip:#222a35; --stage:#0c0f14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:16px}
.app{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;max-width:1400px;margin:0 auto;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.5px;margin:0;line-height:1}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.group{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:8px;border:2px solid transparent}
.group.on{border-color:var(--accent);background:var(--chip)}
.group input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
.pick{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.x{padding:4px 8px;background:none;border:none;color:var(--muted);font-size:18px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erase{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.erase.on{border-color:var(--accent);background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center}
.opts select,.opts input[type=range]{font:inherit;width:100%}
.stage{background:var(--stage);border-radius:10px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);min-width:0}
canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 120px);object-fit:contain;cursor:crosshair;border-radius:4px;touch-action:manipulation}
.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 2px 0}
.status b{color:var(--fg)}
.note{font-size:13px;color:var(--muted)}
#fallback img{width:100%;border:1px solid var(--line);border-radius:6px;margin-top:8px}
#country{width:100%;padding:8px 10px;font:600 15px var(--body);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>

<div class="app">
<aside class="panel">
  <div>
    <h1 id="h1">MAPA DE PROVINCIAS</h1>
    <p class="sub" id="sub">Elegí un color y tocá las provincias en el mapa.</p>
  </div>
  <div class="sec">
    <span class="lbl">País</span>
    <select id="country" aria-label="Elegir país"><option value="ar">Argentina (provincias)</option><option value="br">Brasil (estados)</option></select>
  </div>
  <div class="sec">
    <span class="lbl">Título de la leyenda (opcional)</span>
    <input type="text" id="title" placeholder="Ej: Balotaje 2023">
  </div>
  <div class="sec">
    <span class="lbl">Colores y leyenda</span>
    <div id="groups"></div>
    <label class="erase" id="eraseRow"><input type="radio" class="pick" name="tool" id="toolErase" value="erase"><span id="eraseLbl"> Borrar color (deja la provincia gris)</span></label>
    <div class="row"><button id="addGroup">+ Agregar color</button><button id="fillRest">Pintar las grises con el color activo</button></div>
  </div>
  <div class="sec">
    <span class="lbl" id="chipsLbl">Provincias (tocá para pintar)</span>
    <div class="chips" id="chips"></div>
  </div>
  <div class="sec">
    <span class="lbl">Opciones</span>
    <div class="opts">
      <label><input type="checkbox" id="borders" checked> Bordes</label>
      <label><input type="checkbox" id="inset" checked><span id="insetLbl"> Recuadro CABA</span></label>
      <label><input type="checkbox" id="transp"> Fondo transparente</label>
      <label><input type="checkbox" id="showLegend" checked> Mostrar leyenda</label>
      <label style="grid-column:1/-1">Leyenda en
        <select id="legPos"><option value="left">Izquierda</option><option value="right">Abajo a la derecha</option></select></label>
      <label style="grid-column:1/-1">Tamaño de texto <input type="range" id="fsize" min="40" max="110" value="76"></label>
    </div>
  </div>
  <div class="row">
    <button class="primary" id="dl">Descargar PNG</button>
    <button id="reset">Empezar de cero</button>
  </div>
  <div id="fallback" hidden><p class="note">Si la descarga no arranca, hacé clic derecho en esta imagen y elegí “Guardar imagen como…”.</p><img id="fbimg" alt="Mapa exportado"></div>
</aside>
<main class="stage">
  <canvas id="cv" width="1400" height="1500" aria-label="Mapa de Argentina por provincias"></canvas>
  <div class="status"><span id="hover">Pasá el mouse por una provincia</span><span id="msg"></span></div>
</main>
</div>

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const EMPTY='#d3d6da';
const $=id=>document.getElementById(id);
// Estado dependiente del país elegido (se reasigna en loadCountry)
let CFG,DATA,W,H,MX,MY,names,paths,insetPath,INSET,S,uid=3;
const label=n=>n;
const cap=s=>s[0]+s.slice(1).toLowerCase();
function loadCountry(code){
  CFG=MAPS[code]||MAPS.ar; DATA=CFG.data; INSET=DATA.inset;
  [W,H]=CFG.canvas; cv.width=W; cv.height=H; MX=CFG.mx(W,DATA); MY=CFG.my;
  names=Object.keys(DATA.prov).sort((a,b)=>a.localeCompare(b,'es'));
  paths={}; for(const n of names) paths[n]=new Path2D(DATA.prov[n]);
  insetPath=new Path2D(INSET.path);
  S=CFG.example(names);
  try{const s=JSON.parse(localStorage.getItem(CFG.store)); if(s&&s.groups&&s.assign) S=s;}catch(e){}
  uid=3; for(const g of S.groups) uid=Math.max(uid,g.id+1);
  try{localStorage.setItem('mapa-country',code)}catch(e){}
  // Textos de la interfaz
  $('country').value=code;
  $('h1').textContent='MAPA DE '+CFG.plural;
  $('sub').textContent=`Elegí un color y tocá ${CFG.artPl} en el mapa. ${CFG.sub}`;
  $('chipsLbl').textContent=`${cap(CFG.plural)} (tocá para pintar)`;
  $('insetLbl').textContent=' Recuadro '+INSET.short;
  $('eraseLbl').textContent=` Borrar color (deja ${CFG.unit==='estado'?'el estado':'la provincia'} gris)`;
  $('hover').textContent=`Pasá el mouse por ${CFG.art}`;
  cv.setAttribute('aria-label',`Mapa de ${CFG.name} por ${CFG.units}`);
  $('title').value=S.title||'';
  renderGroups();renderChips();draw();
}
const opt={};
function readOpts(){opt.borders=$('borders').checked;opt.inset=$('inset').checked;opt.transp=$('transp').checked;opt.legend=$('showLegend').checked;opt.pos=$('legPos').value;opt.fs=+$('fsize').value;}
function save(){try{localStorage.setItem(CFG.store,JSON.stringify(S))}catch(e){}}
function colorOf(n){const g=S.groups.find(g=>g.id===S.assign[n]);return g?g.color:EMPTY}

function draw(){
  readOpts();
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(!opt.transp){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H)}
  ctx.save();ctx.translate(MX,MY);ctx.lineJoin='round';
  for(const n of names){ctx.fillStyle=colorOf(n);ctx.fill(paths[n],'evenodd');}
  if(opt.borders){ctx.strokeStyle='#111';ctx.lineWidth=1.1;for(const n of names)ctx.stroke(paths[n]);}
  if(opt.inset){
    const [cx,cy]=INSET.center,[ix,iy]=INSET.inset_center,r=62;
    ctx.strokeStyle='#333';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx+3,cy-2);ctx.lineTo(ix-r,iy+r*0.4);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(ix-r,iy-r,2*r,2*r);ctx.strokeRect(ix-r,iy-r,2*r,2*r);
    ctx.fillStyle=colorOf(INSET.name);ctx.fill(insetPath);
    if(opt.borders){ctx.strokeStyle='#111';ctx.lineWidth=1.2;ctx.stroke(insetPath)}
    ctx.fillStyle='#111';ctx.font='600 15px Barlow, sans-serif';ctx.textAlign='center';ctx.fillText(INSET.short,ix,iy+r+18);ctx.textAlign='left';
  }
  ctx.restore();
  if(opt.legend) drawLegend();
}
function drawLegend(){
  const used=S.groups.filter(g=>g.label.trim()||Object.values(S.assign).includes(g.id));
  if(!used.length&&!S.title)return;
  const fs=opt.fs, sq=Math.round(fs*0.95), gap=Math.round(fs*0.55);
  const titleFont=`${Math.round(fs*0.8)}px Anton, Impact, sans-serif`, rowFont=`${fs}px Anton, Impact, sans-serif`;
  let x=70, y;
  const rowsH=used.length*(sq+gap)-gap+(S.title?fs*1.25:0);
  if(opt.pos==='left'){y=CFG.legendLeft==='bottom'?H-70-rowsH:Math.round(H*0.62-rowsH/2)}
  else if(CFG.legendRightAlign){
    // Leyenda alineada al borde derecho del lienzo: medimos el texto más ancho
    ctx.font=rowFont;let tw=Math.max(0,...used.map(g=>ctx.measureText(g.label||' ').width));
    if(S.title){ctx.font=titleFont;tw=Math.max(tw,ctx.measureText(S.title).width-sq-Math.round(fs*0.6));}
    x=Math.max(70,Math.round(W-70-(sq+Math.round(fs*0.6)+tw)));y=H-70-rowsH;
  } else {x=MX+DATA.w*0.5+20;y=H-70-rowsH;}
  ctx.textBaseline='middle';ctx.fillStyle='#000';
  if(S.title){ctx.font=titleFont;ctx.fillText(S.title,x,y+fs*0.45);y+=fs*1.25;}
  ctx.font=rowFont;
  for(const g of used){
    ctx.fillStyle=g.color;ctx.fillRect(x,y,sq,sq);
    ctx.strokeStyle='#6b6b6b';ctx.lineWidth=3;ctx.strokeRect(x,y,sq,sq);
    ctx.fillStyle='#000';ctx.fillText(g.label||' ',x+sq+Math.round(fs*0.6),y+sq/2+2);
    y+=sq+gap;
  }
  ctx.textBaseline='alphabetic';
}
function hit(ev){
  const r=cv.getBoundingClientRect();
  // canvas uses object-fit: contain → compute rendered box
  const sc=Math.min(r.width/W,r.height/H), ox=(r.width-W*sc)/2, oy=(r.height-H*sc)/2;
  const x=(ev.clientX-r.left-ox)/sc-MX, y=(ev.clientY-r.top-oy)/sc-MY;
  ctx.setTransform(1,0,0,1,0,0);
  if($('inset').checked&&ctx.isPointInPath(insetPath,x,y))return INSET.name;
  if(paths[INSET.name]&&ctx.isPointInPath(paths[INSET.name],x,y))return INSET.name;
  for(const n of names) if(n!==INSET.name&&ctx.isPointInPath(paths[n],x,y,'evenodd'))return n;
  return null;
}
function paint(n){
  if(S.active==='erase') delete S.assign[n]; else S.assign[n]=S.active;
  save();draw();renderGroups();renderChips();
}
cv.addEventListener('click',e=>{const n=hit(e);if(n)paint(n)});
cv.addEventListener('mousemove',e=>{const n=hit(e);$('hover').innerHTML=n?`<b>${label(n)}</b>`:`Pasá el mouse por ${CFG.art}`;cv.style.cursor=n?'pointer':'default'});

function renderGroups(){
  const box=$('groups');box.innerHTML='';
  const counts={};for(const v of Object.values(S.assign))counts[v]=(counts[v]||0)+1;
  for(const g of S.groups){
    const row=document.createElement('div');row.className='group'+(S.active===g.id?' on':'');
    row.innerHTML=`<input type="radio" class="pick" name="tool" id="t${g.id}" ${S.active===g.id?'checked':''} aria-label="Usar este color">
      <input type="color" id="c${g.id}" value="${g.color}" aria-label="Color">
      <input type="text" id="l${g.id}" placeholder="Texto de la leyenda" aria-label="Texto de la leyenda">
      <span class="row" style="gap:2px;flex-wrap:nowrap"><span class="count" title="${cap(CFG.plural)} con este color">${counts[g.id]||0}</span><button class="x" aria-label="Eliminar color">×</button></span>`;
    row.querySelector('input[type=text]').value=g.label;
    row.querySelector('.pick').onchange=()=>{S.active=g.id;save();renderGroups();};
    row.querySelector('input[type=color]').oninput=e=>{g.color=e.target.value;S.active=g.id;save();draw();renderChips();
      document.querySelectorAll('.group').forEach(el=>el.classList.remove('on'));row.classList.add('on');row.querySelector('.pick').checked=true;};
    row.querySelector('input[type=text]').oninput=e=>{g.label=e.target.value;save();draw();};

  const box=$('chips');box.innerHTML='';
  for(const n of names){const b=document.createElement('button');b.className='chip';
    b.innerHTML=`<span class="dot" style="background:${colorOf(n)}"></span>${label(n)}`;b.onclick=()=>paint(n);box.appendChild(b);}
}
$('toolErase').onchange=()=>{S.active='erase';save();renderGroups();};
const PALETTE=['#c8323a','#0b3f80','#2e9a4a','#f0b429','#7b3fa0','#e8742a','#3aa7b8','#8a5a2b'];
$('addGroup').onclick=()=>{const used=S.groups.map(g=>g.color);const c=PALETTE.find(p=>!used.includes(p))||'#888888';
  const g={id:uid++,color:c,label:''};S.groups.push(g);S.active=g.id;save();renderGroups();document.getElementById('l'+g.id).focus();};
$('fillRest').onclick=()=>{if(S.active==='erase')return;for(const n of names)if(!S.assign[n])S.assign[n]=S.active;save();draw();renderGroups();renderChips();};
$('title').oninput=e=>{S.title=e.target.value;save();draw();};
let resetArmed=false;
$('reset').onclick=()=>{if(!resetArmed){resetArmed=true;$('reset').textContent='¿Seguro? Tocá de nuevo';setTimeout(()=>{resetArmed=false;$('reset').textContent='Empezar de cero'},3000);return;}
  resetArmed=false;$('reset').textContent='Empezar de cero';
  S={groups:[{id:uid++,color:'#0b3f80',label:''},{id:uid++,color:'#c8323a',label:''}],assign:{},active:null,title:''};S.active=S.groups[0].id;
  $('title').value='';save();draw();renderGroups();renderChips();};
['borders','inset','transp','showLegend','legPos','fsize'].forEach(id=>$(id).addEventListener('input',draw));
$('country').onchange=e=>{$('msg').textContent='';loadCountry(e.target.value)};

let downloads=null;
if(window.claude&&claude.use) claude.use('downloads').then(d=>{downloads=d}).catch(()=>{});
$('dl').onclick=()=>{
  draw();
  cv.toBlob(async blob=>{
    const url=URL.createObjectURL(blob);
    $('fbimg').src=url;
    if(downloads){
      try{await downloads.save({filename:CFG.file,data:blob});$('msg').textContent='Listo, PNG guardado.';$('fallback').hidden=true;return;}
      catch(e){if(e&&e.code==='declined'){$('msg').textContent='Descarga cancelada.';return;}}
    }
    if(!window.claude){const a=document.createElement('a');a.href=url;a.download=CFG.file;document.body.appendChild(a);a.click();a.remove();$('msg').textContent='Listo, PNG descargado.';return;}
    $('fallback').hidden=false;$('msg').textContent='Guardá la imagen desde el panel.';
  },'image/png');
};
let startCountry='ar';try{const c=localStorage.getItem('mapa-country');if(MAPS[c])startCountry=c;}catch(e){}
loadCountry(startCountry);
document.fonts&&document.fonts.load('76px Anton').then(draw);
document.fonts&&document.fonts.ready.then(draw);
</script>

</body>
